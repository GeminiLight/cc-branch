name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub release tag to attach Python artifacts to"
        required: false
        default: ""
      publish_to_pypi:
        description: "Publish to PyPI when Trusted Publishing is configured"
        required: false
        default: "false"
      publish_to_npm:
        description: "Publish the npm tarball when NPM_TOKEN is configured"
        required: false
        default: "false"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/package-lock.json

      - name: Install web dependencies
        working-directory: apps
        run: npm ci

      - name: Build packaged Web UI
        run: python scripts/build-webui.py

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover tests

      - name: Run web tests
        working-directory: apps/web
        run: npm run test

      - name: Build Python package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Build npm package artifact
        run: python scripts/build-npm-package.py

      - name: Prepare PyPI package directory
        run: |
          rm -rf dist/pypi
          mkdir -p dist/pypi
          cp dist/cc_branch-* dist/pypi/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            dist/cc_branch-*
            dist/cc-branch-*.tgz

      - name: Attach package artifacts to release
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/cc_branch-* dist/cc-branch-*.tgz --clobber

      - name: Publish to PyPI with Trusted Publishing
        if: ${{ env.PYPI_API_TOKEN == '' && (github.event_name == 'release' || inputs.publish_to_pypi == 'true') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi

      - name: Publish to PyPI with API token
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Report PyPI skip
        if: ${{ env.PYPI_API_TOKEN == '' && github.event_name != 'release' && inputs.publish_to_pypi != 'true' }}
        run: |
          echo "::notice::Skipped PyPI upload. Configure PYPI_API_TOKEN or run this workflow with publish_to_pypi=true after setting up PyPI Trusted Publishing."

      - name: Publish to npm registry
        if: ${{ env.NPM_TOKEN != '' && inputs.publish_to_npm == 'true' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish dist/cc-branch-*.tgz --access public

      - name: Report npm skip
        if: ${{ env.NPM_TOKEN == '' || inputs.publish_to_npm != 'true' }}
        run: |
          echo "::notice::Skipped npm registry upload. Configure NPM_TOKEN and run this workflow with publish_to_npm=true to publish cc-branch to npm."
